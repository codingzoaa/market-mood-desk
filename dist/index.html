/* The mobile menu stays above the page in both scroll directions. */
.mobile-brand,.mobile-nav{display:none}
.app-shell{min-height:100dvh}
.index-strip{display:block;margin-bottom:14px}
.index-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.index-tile>span{font-family:inherit;font-size:12px;font-weight:600;letter-spacing:0;color:#687f68}
.index-tile>strong{display:block;font-size:26px;letter-spacing:-1px;margin:10px 0 7px}
.index-tile p{display:flex;justify-content:space-between;align-items:center;gap:5px}
.index-tile p>span{font:11px var(--mono);white-space:nowrap}
.index-tile p>small{font:8px var(--mono);letter-spacing:0;white-space:nowrap}
.etf-ranking-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.etf-panel{padding:21px 22px;margin-bottom:23px}
.etf-panel .section-title{margin-bottom:16px}
.etf-panel .section-title h2{font-size:17px}
.etf-sort-label{font-size:10px;color:#89987c;white-space:nowrap}
.etf-list{list-style:none;margin:0;padding:0}
.etf-row{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid #edf1e8;min-width:0}
.etf-row:last-child{border-bottom:0}
.etf-rank{font:11px var(--mono);color:#a0ad92;min-width:19px}
.etf-row:first-child .etf-rank{color:var(--green)}
.etf-name{flex:1;min-width:0}
.etf-name strong{display:block;font-size:13px;line-height:1.6;font-weight:550;overflow-wrap:anywhere}
.etf-name:hover strong{color:var(--green)}
.etf-name small{display:block;font:10px var(--mono);color:#94a187;margin-top:3px}
.etf-values{text-align:right;flex-shrink:0}
