name: Recover Naver industry heatmap
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'worker/naver-heatmap.mjs'
      - 'scripts/collect_naver_heatmap.mjs'
      - 'scripts/publish_naver_heatmap.mjs'
      - '.github/workflows/naver-heatmap.yml'
permissions:
  contents: read
concurrency:
  group: naver-heatmap-bootstrap
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - name: Collect and validate complete KRX industry map from Naver
        run: node scripts/collect_naver_heatmap.mjs
      - name: Save the verified map without changing LS quotes
        env:
          RAW_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import {spawnSync} from 'node:child_process';
          const token=(process.env.RAW_CLOUDFLARE_TOKEN||'').trim().replace(/^["']|["']$/g,'').trim().replace(/^Bearer\s+/i,'').trim();
          if(!token||/\s/.test(token))throw Error('CLOUDFLARE_TOKEN_FORMAT_INVALID');
          const env={...process.env,CLOUDFLARE_API_TOKEN:token};delete env.RAW_CLOUDFLARE_TOKEN;
          const result=spawnSync('node',['scripts/publish_naver_heatmap.mjs'],{env,stdio:'inherit'});
          process.exit(result.status??1);
          JS
