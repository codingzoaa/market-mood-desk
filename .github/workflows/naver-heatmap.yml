name: Refresh Naver industry heatmap
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'worker/naver-heatmap.mjs'
      - 'scripts/collect_naver_heatmap.mjs'
      - '.github/workflows/naver-heatmap.yml'
  schedule:
    - cron: '*/5 0-10 * * 1-5'
    - cron: '0 11 * * 1-5'
permissions:
  contents: read
concurrency:
  group: naver-heatmap-bootstrap
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: market-note-ls-worker-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - name: Collect and validate complete KRX industry map from Naver
        id: source
        run: node scripts/collect_naver_heatmap.mjs
      - name: Publish verified data through the existing Worker deployment
        if: steps.source.outputs.ready == 'true'
        env:
          RAW_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import {spawnSync} from 'node:child_process';
          const token=(process.env.RAW_CLOUDFLARE_TOKEN||'').trim().replace(/^["']|["']$/g,'').trim().replace(/^Bearer\s+/i,'').trim();
          if(!token||/\s/.test(token))throw Error('CLOUDFLARE_TOKEN_FORMAT_INVALID');
          const env={...process.env,CLOUDFLARE_API_TOKEN:token};delete env.RAW_CLOUDFLARE_TOKEN;
          const result=spawnSync('npx',['--yes','wrangler@4','deploy','--config','worker/wrangler.jsonc'],{env,stdio:'inherit'});
          process.exit(result.status??1);
          JS
      - name: Verify published stock counts and retrieval time
        if: steps.source.outputs.ready == 'true'
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const expected=JSON.parse(fs.readFileSync('work/naver-heatmap.json','utf8'));
          const response=await fetch('https://market-note-ls-api.kby0991.workers.dev/api/market-details?date='+expected.date,{signal:AbortSignal.timeout(20000),redirect:'error'});
          if(!response.ok)throw Error('NAVER_PUBLISHED_HTTP_'+response.status);
          const data=(await response.json()).details?.heatmap;
          if(data?.date!==expected.date||Date.parse(data.asOf)<Date.parse(expected.asOf)||data.stocks.length<2000)throw Error('NAVER_PUBLISHED_MISMATCH');
          console.log(JSON.stringify({published:true,date:data.date,asOf:data.asOf,stocks:data.stocks.length}));
          JS
