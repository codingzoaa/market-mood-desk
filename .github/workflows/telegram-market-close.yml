name: Telegram Market Close (KRX)
on:
  schedule:
    - cron: '30 16 * * 1-5'
      timezone: 'Asia/Seoul'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-market-close
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check configuration and send verified market close
        env:
          MARKET_DETAILS_URL: ${{ vars.MARKET_DETAILS_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/telegram-market-close.mjs
