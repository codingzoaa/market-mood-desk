name: Update KOSPI pension signal data
on:
  push:
    branches: [main]
    paths: ['.github/workflows/kospi-pension-daily.yml']
  schedule:
    # GitHub Actions uses UTC. 07:30 UTC = 16:30 KST year-round.
    - cron: '30 7 * * 1-5'
    # Fall back after LS pension data becomes available; never fabricate values.
    - cron: '40 9 * * 1-5'
    - cron: '20 12 * * 1-5'
    - cron: '45 12 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kospi-pension-daily-sync
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Import LS post-close KOSPI and pension data
        env:
          PENSION_DAILY_FEED_URL: https://market-note-ls-api.kby0991.workers.dev/api/pension-kospi-daily
        run: |
          # Start at 16:30 KST on trading weekdays; retry briefly for LS data
          # propagation. The importer rejects intraday, stale/conflicting values.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node scripts/update-kospi-pension.mjs
          else
            for attempt in $(seq 1 15); do
              if node scripts/update-kospi-pension.mjs; then exit 0; fi
              if [ "$attempt" -lt 15 ]; then
                echo "LS post-close data not ready: retry $attempt/15"
                sleep 20
              fi
            done
            echo "::error::LS pension daily data was not verified; existing site data preserved"
            exit 1
          fi
      - name: Commit only verified new data
        run: |
          if git diff --quiet -- public/kospi-pension-rsi.json; then
            echo "No change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/kospi-pension-rsi.json
          git commit -m "data: append verified KOSPI pension daily close"
          # Repository can receive other updates while the scheduled job runs.
          git pull --rebase origin main
          git push origin HEAD:main
