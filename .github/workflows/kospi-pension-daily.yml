name: Update KOSPI pension signal data
on:
  push:
    branches: [main]
    paths: ['.github/workflows/kospi-pension-daily.yml']
  schedule:
    - cron: '40 9 * * 1-5'
    - cron: '20 12 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kospi-pension-daily-sync
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Import LS post-close KOSPI and pension data
        env:
          PENSION_DAILY_FEED_URL: https://market-note-ls-api.kby0991.workers.dev/api/pension-kospi-daily
        run: |
          # Manual workflow update provides a bounded one-time retry window.
          if [ "${{ github.event_name }}" != "push" ]; then
            node scripts/update-kospi-pension.mjs
          else
            for attempt in $(seq 1 15); do
              if node scripts/update-kospi-pension.mjs; then exit 0; fi
              echo "Waiting for LS post-close pension recovery: attempt $attempt/15"
              sleep 20
            done
            echo "::error::LS pension dataset was not verified in time; no data written"
            exit 1
          fi
      - name: Commit only verified new data
        run: |
          if git diff --quiet -- public/kospi-pension-rsi.json; then
            echo "No change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/kospi-pension-rsi.json
          git commit -m "data: append verified KOSPI pension daily close"
          git push
