name: Update KOSPI pension signal data
on:
  schedule:
    - cron: '40 9 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kospi-pension-daily-sync
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Import LS post-close KOSPI and pension data
        env:
          PENSION_DAILY_FEED_URL: https://market-note-ls-api.kby0991.workers.dev/api/pension-kospi-daily
        run: node scripts/update-kospi-pension.mjs
      - name: Commit only verified new data
        run: |
          if git diff --quiet -- public/kospi-pension-rsi.json; then
            echo "No change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/kospi-pension-rsi.json
          git commit -m "data: append verified KOSPI pension daily close"
          git push
