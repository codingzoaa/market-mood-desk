name: Private account review (no deployment)
on:
  pull_request:
    branches: [feature/history-rvol-pipeline]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
      - run: node scripts/build-worker.mjs
      - run: node scripts/build-account.mjs
