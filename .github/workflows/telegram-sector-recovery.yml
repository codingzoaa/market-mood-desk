name: Recover owner-requested failed sector briefing
on:
  workflow_run:
    workflows: ['Deploy LS Cloudflare Worker']
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: telegram-sector-owner-recovery
  cancel-in-progress: false
jobs:
  recover:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && startsWith(github.event.workflow_run.head_commit.message, 'ops: recover')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Recover only the failed sector briefing using signed Worker request
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: node scripts/recover-sector-delivery.mjs
