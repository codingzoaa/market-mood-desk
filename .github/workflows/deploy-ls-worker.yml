name: Deploy LS Cloudflare Worker
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'src/data/stock-map.json'
      - 'src/data/stock-map-verified.json'
      - '.github/workflows/deploy-ls-worker.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: market-note-ls-worker-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Cloudflare token and deploy existing Worker
        working-directory: worker
        env:
          RAW_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          RAW_TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node --input-type=module <<'JS'
          import {spawnSync} from 'node:child_process';
          import {mkdtempSync,writeFileSync,rmSync} from 'node:fs';
          import {tmpdir} from 'node:os';
          import {join} from 'node:path';
          const raw=process.env.RAW_CLOUDFLARE_TOKEN||'';
          let token=raw.trim().replace(/^["']|["']$/g,'').trim();
          token=token.replace(/^Bearer\s+/i,'').trim();
          if(!token||/\s/.test(token)){
            console.error('CLOUDFLARE_TOKEN_FORMAT_INVALID: re-create the secret using only the API token value (no Bearer prefix or extra text).');
            process.exit(1);
          }
          // Never log the token, token response, or response headers.
          // Cloudflare supports both user-scoped and account-owned API tokens.
          const accountId='78961f2ddb841df708b3a777fdcc94c2';
          let active=false;
          const failures=[];
          for (const [kind,verifyPath] of [
            ['user','/user/tokens/verify'],
            ['account','/accounts/'+accountId+'/tokens/verify']
          ]) {
            const response=await fetch('https://api.cloudflare.com/client/v4'+verifyPath,{
              headers:{Authorization:'Bearer '+token,Accept:'application/json'},
              redirect:'error',
              signal:AbortSignal.timeout(15000)
            });
            const check=await response.json().catch(()=>({}));
            if(response.ok && check.success===true && check.result?.status==='active') {
              console.log('CLOUDFLARE_'+kind.toUpperCase()+'_TOKEN_ACTIVE');
              active=true;
              break;
            }
            failures.push(kind+'='+String(Number(check.errors?.[0]?.code)||response.status));
          }
          if(!active){
            console.error('CLOUDFLARE_TOKEN_VERIFICATION_FAILED ('+failures.join(',')+'). Replace the GitHub secret with a valid token for the correct Cloudflare account.');
            process.exit(1);
          }
          console.log('CLOUDFLARE_TOKEN_ACTIVE; deploying Worker.');
          const env={...process.env,CLOUDFLARE_API_TOKEN:token};
          delete env.RAW_CLOUDFLARE_TOKEN;
          const bot=process.env.RAW_TELEGRAM_BOT_TOKEN||'';
          const chat=process.env.RAW_TELEGRAM_CHAT_ID||'';
          if(!bot||!chat){console.error('TELEGRAM_GITHUB_SECRETS_MISSING; refusing incomplete Cloudflare Cron deployment');process.exit(1);}
          const dir=mkdtempSync(join(tmpdir(),'market-note-secrets-'));
          const path=join(dir,'secrets.json');
          try{
            writeFileSync(path,JSON.stringify({TELEGRAM_BOT_TOKEN:bot,TELEGRAM_CHAT_ID:chat}),{mode:0o600});
            delete env.RAW_TELEGRAM_BOT_TOKEN;delete env.RAW_TELEGRAM_CHAT_ID;
            const child=spawnSync('npx',['--yes','wrangler@4','deploy','--config','wrangler.jsonc','--secrets-file',path],{cwd:process.cwd(),env,stdio:'inherit'});
            if(child.error)console.error('WRANGLER_EXECUTION_FAILED '+child.error.name);
            process.exitCode=child.status??1;
          }finally{rmSync(dir,{recursive:true,force:true});}
          JS

      - name: Verify deployed LS pension endpoint without exposing credentials
        run: |
          node --input-type=module <<'JS'
          const url='https://market-note-ls-api.kby0991.workers.dev/api/pension-kospi-daily';
          const response=await fetch(url,{headers:{Accept:'application/json'},signal:AbortSignal.timeout(15000),redirect:'error'});
          const body=await response.json().catch(()=>({}));
          console.log('LS_PENSION_API_STATUS '+JSON.stringify({
            http:response.status,
            date:typeof body.date==='string'?body.date:null,
            kospiClose:typeof body.kospiClose==='number'?body.kospiClose:null,
            pensionNetBuyBillion:typeof body.pensionNetBuyBillion==='number'?body.pensionNetBuyBillion:null,
            pensionUnit:body.pensionUnit||null,
            error:body.error||null,
            latestDate:body.latestDate||null
          }));
          if(response.status!==200 && !(response.status===503 && body.error==='PENSION_KOSPI_DAILY_NOT_READY'))
            process.exit(1);
          JS

      - name: Report safely verified LS venue probe status
        continue-on-error: true
        run: |
          node --input-type=module <<'JS'
          const date=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
          const url='https://market-note-ls-api.kby0991.workers.dev/api/investor-flow-venues?date='+date;
          try{
            const response=await fetch(url,{signal:AbortSignal.timeout(15000),headers:{Accept:'application/json'}});
            const d=await response.json();
            console.log('LS_VENUE_PROBE '+JSON.stringify({
              date,status:response.ok?d.status:'HTTP_'+response.status,
              scope:d.scope||null,asOf:d.asOf||null,error:d.error||null,
              markets:d.segments?Object.keys(d.segments):[]
            }));
          }catch{console.log('LS_VENUE_PROBE_UNAVAILABLE');}
          JS
