name: Deploy LS Cloudflare Worker
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-ls-worker.yml'
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: market-note-ls-worker-deploy
  cancel-in-progress: false
jobs:
  credential_check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare deployment token presence (not its value)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'CLOUDFLARE_TOKEN_CONFIGURED'
          else
            echo '::warning::CLOUDFLARE_TOKEN_NOT_CONFIGURED'
          fi
  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Cloudflare deployment credentials
        id: token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare token not configured; Worker unchanged. Configure CLOUDFLARE_API_TOKEN in repository Actions secrets."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy existing LS Worker
        if: steps.token.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
          command: deploy --config wrangler.jsonc
          wranglerVersion: '4'
