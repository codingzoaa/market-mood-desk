name: Deploy LS Cloudflare Worker
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-ls-worker.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: market-note-ls-worker-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Cloudflare token and deploy existing Worker
        working-directory: worker
        env:
          RAW_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import {spawnSync} from 'node:child_process';
          const raw=process.env.RAW_CLOUDFLARE_TOKEN||'';
          let token=raw.trim().replace(/^["']|["']$/g,'').trim();
          token=token.replace(/^Bearer\s+/i,'').trim();
          if(!token||/\s/.test(token)){
            console.error('CLOUDFLARE_TOKEN_FORMAT_INVALID: re-create the secret using only the API token value (no Bearer prefix or extra text).');
            process.exit(1);
          }
          // Never print the token, its prefix, or Cloudflare response headers.
          const verify=await fetch('https://api.cloudflare.com/client/v4/user/tokens/verify',{
            headers:{Authorization:'Bearer '+token,Accept:'application/json'},
            redirect:'error',
            signal:AbortSignal.timeout(15000)
          });
          const check=await verify.json().catch(()=>({}));
          if(!verify.ok||check.success!==true||check.result?.status!=='active'){
            const code=Number(check.errors?.[0]?.code)||verify.status;
            console.error('CLOUDFLARE_TOKEN_VERIFICATION_FAILED code='+code+' (token invalid, expired, or not an API token).');
            process.exit(1);
          }
          console.log('CLOUDFLARE_TOKEN_ACTIVE; deploying Worker.');
          const env={...process.env,CLOUDFLARE_API_TOKEN:token};
          delete env.RAW_CLOUDFLARE_TOKEN;
          const child=spawnSync('npx',['--yes','wrangler@4','deploy','--config','wrangler.jsonc'],{cwd:process.cwd(),env,stdio:'inherit'});
          if(child.error)console.error('WRANGLER_EXECUTION_FAILED '+child.error.name);
          process.exit(child.status??1);
          JS
