name: Save reviewed sector note
on:
  issues:
    types: [opened, edited]
permissions:
  contents: write
  actions: write
  issues: write
concurrency:
  group: shared-sector-notes
  cancel-in-progress: false
jobs:
  save:
    if: github.event.issue.user.login == github.repository_owner && github.actor == github.repository_owner && startsWith(github.event.issue.title, '[섹터 자료] ')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validate owner-reviewed material
        run: node scripts/apply_sector_note_issue.mjs
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Save the reviewed note
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/sector-notes.json
          git commit -m 'data: save owner-reviewed sector note'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Deploy shared notes to the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # GITHUB_TOKEN commits do not trigger ordinary push workflows.
          STARTED="$(date -u +%FT%TZ)"
          gh workflow run pages.yml --ref main
          RUN=""
          for i in $(seq 1 30); do
            RUN="$(gh run list --workflow pages.yml --event workflow_dispatch --branch main --limit 10 --json databaseId,createdAt --jq "[.[] | select(.createdAt>=\"$STARTED\")] | sort_by(.createdAt) | last | .databaseId // empty")"
            [[ -n "$RUN" ]] && break
            sleep 3
          done
          [[ -n "$RUN" ]] || { echo 'SECTOR_NOTE_DEPLOY_RUN_MISSING'; exit 1; }
          gh run watch "$RUN" --exit-status
          DEPLOYED="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/jobs" --jq '[.jobs[] | select(.name=="deploy" and .conclusion=="success")] | length')"
          [[ "$DEPLOYED" == "1" ]] || { echo 'SECTOR_NOTE_DEPLOY_NOT_CONFIRMED'; exit 1; }
          node scripts/verify-published-sector-note.mjs
      - name: Close completed save request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue close "$ISSUE_NUMBER"
