name: Telegram PR data readiness (no send)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/telegram-pr-readiness.yml'
      - 'scripts/telegram-market-close.mjs'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Inspect live LS Worker without Telegram secrets or a send
        env:
          MARKET_DETAILS_URL: https://market-note-ls-api.kby0991.workers.dev/api/market-details
          TELEGRAM_DRY_RUN: 'true'
        run: node scripts/telegram-market-close.mjs
