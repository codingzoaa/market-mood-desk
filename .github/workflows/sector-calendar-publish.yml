name: Publish verified sector calendar at 17 KST
on:
  schedule:
    # UTC: 17:00 KST initial attempt; off-hour backups reduce scheduler congestion.
    - cron: '0 8 * * 1-5'
    - cron: '7,37 8,9 * * 1-5'
    - cron: '7 10 * * 1-5'
  workflow_dispatch:
  # A completed close-data update is a second wake-up path if cron is delayed.
  workflow_run:
    workflows: ['Update KOSPI pension signal data']
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.github/workflows/sector-calendar-publish.yml'
      - 'scripts/publish-sector-calendar.mjs'
      - 'scripts/naver-sector-news.mjs'
      - 'tests/close-calendar.test.mjs'
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: verified-sector-calendar-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Record invocation and Korean local time
        run: echo "SECTOR_INVOCATION event=${{ github.event_name }} utc=$(date -u +%FT%TZ) kst=$(TZ=Asia/Seoul date +%FT%T%z)"
      - name: Generate same-day evidence-gated editorial review
        id: review
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          node --input-type=module -e 'console.log("NAVER_NEWS_CONFIG="+(process.env.NAVER_CLIENT_ID&&process.env.NAVER_CLIENT_SECRET?"ready":"missing_credentials"))'
          node scripts/publish-sector-calendar.mjs
          # Use the selected market date, never the runner's calendar date.
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const result=JSON.parse(fs.readFileSync('work/sector-calendar-result.json','utf8'));
          if(!/^\d{4}-\d{2}-\d{2}$/.test(result.date))throw Error('REVIEW_RESULT_DATE_INVALID');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`date=${result.date}\nresult=${result.status}\n`);
          JS
          git add public/sector-review-status.json src/close-reviews.ts src/close-review-20*.ts
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "SECTOR_NO_REVIEW_CHANGE"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate candidate with full test, type check and build
        if: steps.review.outputs.changed == 'true' && steps.review.outputs.result == 'published'
        run: |
          npm ci
          npm test
          npx tsc --noEmit
          npm run build
      - name: Create PR, verify CI, merge and deploy existing Pages
        if: steps.review.outputs.changed == 'true' && steps.review.outputs.result == 'published'
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_DATE: ${{ steps.review.outputs.date }}
        run: |
          set -euo pipefail
          BRANCH="automation/verified-sector-calendar-${REVIEW_DATE}"
          # Existing pending PRs are not overwritten or bypassed.
          if [[ "$(gh pr list --state open --head "$BRANCH" --json number --jq 'length')" != "0" ]]; then
            echo "SECTOR_PR_ALREADY_OPEN branch=$BRANCH"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git commit -m "data: verify sector calendar $REVIEW_DATE"
          git push --set-upstream origin "$BRANCH"
          COMMIT="$(git rev-parse HEAD)"
          PR="$(gh pr create --base main --head "$BRANCH" --title "data: verified sector calendar $REVIEW_DATE" --body "Evidence-gated 17:00 KST editorial calendar update. Same-day LS regular-session stocks and timestamped trusted press headlines required. Missing data remains pending; no synthetic score or sector count. Requires successful dispatched Pages CI before merging and Pages deployment afterwards.")"
          echo "SECTOR_PR_CREATED $PR"
          # PRs written with GITHUB_TOKEN do not trigger pull_request workflows.
          # Dispatch the existing Pages workflow explicitly against the PR branch
          # to run npm tests + TypeScript + build as a separate CI run.
          gh workflow run pages.yml --ref "$BRANCH"
          CI_RUN=""
          for i in $(seq 1 35); do
            CI_RUN="$(gh run list --workflow pages.yml --event workflow_dispatch --branch "$BRANCH" --limit 20 --json databaseId,headSha --jq "[.[] | select(.headSha==\"$COMMIT\")][0].databaseId // empty" 2>/dev/null || true)"
            [[ -n "$CI_RUN" ]] && break
            sleep 3
          done
          [[ -n "$CI_RUN" ]] || { echo 'SECTOR_PR_CI_MISSING';exit 1; }
          echo "SECTOR_PR_CI_RUN $CI_RUN"
          gh run watch "$CI_RUN" --exit-status
          # Guard against concurrent main updates and accidental unverified changes.
          git fetch origin main
          gh pr view "$PR" --json mergeable --jq .mergeable | grep -qx MERGEABLE
          gh pr merge "$PR" --merge --delete-branch
          git fetch origin main
          MERGED="$(git rev-parse origin/main)"
          echo "SECTOR_PR_MERGED sha=$MERGED"
          # Merges performed using GITHUB_TOKEN suppress normal push workflows.
          # Explicitly dispatch Pages and block until its deploy job completes.
          gh workflow run pages.yml --ref main
          DEPLOY_RUN=""
          for i in $(seq 1 35); do
            DEPLOY_RUN="$(gh run list --workflow pages.yml --event workflow_dispatch --branch main --limit 25 --json databaseId,headSha --jq "[.[] | select(.headSha==\"$MERGED\")][0].databaseId // empty" 2>/dev/null || true)"
            [[ -n "$DEPLOY_RUN" ]] && break
            sleep 3
          done
          [[ -n "$DEPLOY_RUN" ]] || { echo 'SECTOR_PAGES_RUN_MISSING';exit 1; }
          echo "SECTOR_PAGES_RUN $DEPLOY_RUN"
          gh run watch "$DEPLOY_RUN" --exit-status
          # Check that deployment was not skipped (successful build alone is insufficient).
          JOB_STATUS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DEPLOY_RUN/jobs" --jq '[.jobs[] | select(.name=="deploy" and .conclusion=="success")] | length')"
          [[ "$JOB_STATUS" == "1" ]] || { echo 'SECTOR_PAGES_DEPLOY_NOT_CONFIRMED';exit 1; }
          echo "SECTOR_PAGES_DEPLOYED date=$REVIEW_DATE sha=$MERGED url=https://codingzoaa.github.io/market-mood-desk/#calendar"

      - name: Report publication result and expose verification failures
        if: always()
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const file='work/sector-calendar-result.json';
          if(!fs.existsSync(file)){fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'## 강세 섹터 리뷰\n실행 결과를 생성하지 못했습니다. 앞 단계 오류를 확인하세요.\n');process.exit(1);}
          const r=JSON.parse(fs.readFileSync(file,'utf8'));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,`## 강세 섹터 리뷰\n대상 거래일: ${r.date}\n결과: ${r.status}\n${r.reason||'이미 등록된 리뷰를 확인했습니다.'}\n`);
          if(r.status==='pending'){console.error('SECTOR_VERIFICATION_PENDING '+r.date);process.exit(1);}
          JS
