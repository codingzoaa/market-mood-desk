name: Verify missing stock classifications
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stock-classification.yml'
      - 'scripts/verify_stock_sectors.mjs'
      - 'worker/stock-verification.mjs'
      - 'src/data/stock-map.json'
  schedule:
    - cron: '10 0-11 * * 1-5'
permissions:
  contents: write
concurrency:
  group: stock-classification-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      deploy: ${{ steps.status.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate official identities and industries
        run: node scripts/verify_stock_sectors.mjs
      - name: Detect changes or retry an incomplete deployment
        id: status
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const report=JSON.parse(fs.readFileSync('work/stock-verification-report.json','utf8'));
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`deploy=${report.deployNeeded}\nchanged=${report.changed}\n`);
          JS
      - if: steps.status.outputs.deploy == 'true'
        run: npm ci
      - if: steps.status.outputs.deploy == 'true'
        run: npm test
      - if: steps.status.outputs.deploy == 'true'
        run: npx tsc --noEmit
      - name: Publish verified classifications
        if: steps.status.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/stock-map-verified.json
          git commit -m 'data: verify missing stock classifications against KRX KIND'
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stock-classification-verification
          path: work/stock-verification-report.json
          retention-days: 7
          if-no-files-found: ignore
  deploy:
    if: needs.verify.outputs.deploy == 'true'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: market-note-ls-worker-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Deploy classification data to the existing quote Worker
        env:
          RAW_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import {spawnSync} from 'node:child_process';
          const token=(process.env.RAW_CLOUDFLARE_TOKEN||'').trim().replace(/^["']|["']$/g,'').trim().replace(/^Bearer\s+/i,'').trim();
          if(!token||/\s/.test(token))throw Error('CLOUDFLARE_TOKEN_FORMAT_INVALID');
          const env={...process.env,CLOUDFLARE_API_TOKEN:token};delete env.RAW_CLOUDFLARE_TOKEN;
          const child=spawnSync('npx',['--yes','wrangler@4','deploy','--config','worker/wrangler.jsonc'],{env,stdio:'inherit'});process.exit(child.status??1);
          JS
      - name: Verify the published manifest version
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const expected=JSON.parse(fs.readFileSync('src/data/stock-map-verified.json','utf8'));
          const response=await fetch('https://market-note-ls-api.kby0991.workers.dev/api/stock-map?verification='+Date.now(),{signal:AbortSignal.timeout(15000),redirect:'error'});
          if(!response.ok)throw Error('REGISTRY_VERIFY_HTTP_'+response.status);
          const actual=await response.json();
          if(actual.verification?.checkedAt!==expected.checkedAt||actual.verification?.sourceSha256!==expected.sourceSha256)throw Error('REGISTRY_DEPLOYMENT_NOT_CURRENT');
          console.log(JSON.stringify({verified:actual.verification.verified,pending:actual.verification.pending,checkedAt:actual.verification.checkedAt}));
          JS
