name: Telegram one-time delivery verification
on:
  push:
    branches:
      - ops/telegram-delivery-verify-20261102
    paths:
      - .github/workflows/telegram-delivery-verification.yml

permissions:
  contents: read

concurrency:
  group: telegram-market-close
  cancel-in-progress: false

jobs:
  verify-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate LS close, authenticate Telegram, send one verified report
        env:
          MARKET_DETAILS_URL: https://market-note-ls-api.kby0991.workers.dev/api/market-details
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node --input-type=module <<'JS'
          import {main} from './scripts/telegram-market-close.mjs';
          const env=process.env;
          const token=(env.TELEGRAM_BOT_TOKEN||'').trim();
          const chatId=(env.TELEGRAM_CHAT_ID||'').trim();
          const ensure=(ok,code)=>{if(!ok)throw Error(code);};
          const request=async(method,body)=>{
            const response=await fetch('https://api.telegram.org/bot'+token+'/'+method,{
              method:'POST',
              headers:{'Content-Type':'application/json'},
              body:JSON.stringify(body||{}),
              signal:AbortSignal.timeout(15000),
              redirect:'error'
            });
            const data=await response.json().catch(()=>({}));
            ensure(response.ok&&data.ok===true&&data.result!==undefined,
              'TELEGRAM_'+method.toUpperCase()+'_FAILED_HTTP_'+response.status+'_CODE_'+String(data.error_code||'UNKNOWN'));
            return data.result;
          };
          try{
            const preflight=await main({...env,TELEGRAM_DRY_RUN:'true'});
            ensure(preflight.status==='checked','LS_PREFLIGHT_NOT_VERIFIED');
            ensure(token&&chatId,'TELEGRAM_CREDENTIALS_MISSING');
            const bot=await request('getMe',{});
            ensure(bot.is_bot===true&&typeof bot.id==='number','BOT_AUTH_INVALID');
            console.log('TELEGRAM_GETME_AUTH_OK');
            const chat=await request('getChat',{chat_id:chatId});
            ensure(chat&&typeof chat.id==='number','CHAT_ID_INVALID');
            if(/^-?[0-9]+$/.test(chatId))ensure(String(chat.id)===chatId,'CHAT_ID_MISMATCH');
            console.log('TELEGRAM_GETCHAT_ACCESS_OK');
            let sent=0;
            const output=await main({...env,TELEGRAM_DRY_RUN:'false'},{
              deliverMessage:async text=>{
                const message=await request('sendMessage',{chat_id:chatId,text});
                ensure(Number.isInteger(message.message_id)&&message.chat&&message.chat.id===chat.id,
                  'TELEGRAM_MESSAGE_ACK_INVALID');
                sent++;
                console.log('TELEGRAM_SENDMESSAGE_ACCEPTED message_id='+message.message_id);
              }
            });
            ensure(output.status==='delivered'&&sent===1,'TELEGRAM_DELIVERY_COUNT_UNEXPECTED');
            console.log('TELEGRAM_VERIFIED_DELIVERY date='+output.date+' parts='+sent+' (delivery to Telegram server, not device read receipt)');
          }catch(e){
            console.error('TELEGRAM_ONE_TIME_VERIFY_FAILED '+String(e?.message||'UNKNOWN').replace(/https?:\/\/\S+/g,'[url]'));
            process.exitCode=1;
          }
          JS
